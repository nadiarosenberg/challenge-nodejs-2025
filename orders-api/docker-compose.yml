version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  redis:
    image: redis:7
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HTTP_PORT=${HTTP_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_EXTERNAL_PORT=${REDIS_EXTERNAL_PORT}
      - CACHE_TTL=${CACHE_TTL}
      - REDIS_CONNECT_TIMEOUT=${REDIS_CONNECT_TIMEOUT}
      - REDIS_COMMAND_TIMEOUT=${REDIS_COMMAND_TIMEOUT}
      - HEALTHCHECK_INTERVAL=${HEALTHCHECK_INTERVAL}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT}
      - HEALTHCHECK_RETRIES=${HEALTHCHECK_RETRIES}
      - ORDER_HARD_DELETE_DAYS=${ORDER_HARD_DELETE_DAYS}
      - CACHE_ORDERS_KEY=${CACHE_ORDERS_KEY}
      - DB_POOL_MAX=${DB_POOL_MAX}
      - DB_POOL_MIN=${DB_POOL_MIN}
      - DB_POOL_ACQUIRE=${DB_POOL_ACQUIRE}
      - DB_POOL_IDLE=${DB_POOL_IDLE}
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "./start.sh"]

volumes:
  db_data:

