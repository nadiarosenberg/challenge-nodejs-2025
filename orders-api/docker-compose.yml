version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-orders_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}

  redis:
    image: redis:7
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HTTP_PORT=${HTTP_PORT:-3001}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-orders_db}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_EXTERNAL_PORT=${REDIS_EXTERNAL_PORT:-6379}
      - CACHE_TTL=${CACHE_TTL:-3600}
      - REDIS_CONNECT_TIMEOUT=${REDIS_CONNECT_TIMEOUT:-10000}
      - REDIS_COMMAND_TIMEOUT=${REDIS_COMMAND_TIMEOUT:-5000}
      - HEALTHCHECK_INTERVAL=${HEALTHCHECK_INTERVAL:-30s}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT:-10s}
      - HEALTHCHECK_RETRIES=${HEALTHCHECK_RETRIES:-3}
      - ORDER_HARD_DELETE_DAYS=${ORDER_HARD_DELETE_DAYS:-30}
    ports:
      - "${HTTP_PORT:-3001}:${HTTP_PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "./start.sh"]

volumes:
  db_data:

